name: Publish plugin release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' _meta.lua | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package CWSync
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/cwsync.koplugin
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'dist' \
            -exec cp -a {} dist/cwsync.koplugin/ \;
          (
            cd dist
            zip -qr cwsync.koplugin.zip cwsync.koplugin
          )

      - name: Extract release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## [" version "] - ") == 1 { in_release=1; next }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no release section for $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          gh release create "$TAG" dist/cwsync.koplugin.zip \
            --target "${GITHUB_SHA}" \
            --title "CWSync $VERSION" \
            --notes-file RELEASE_NOTES.md

      - name: Try to add Storefront discovery topic
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/topics" \
            -f 'names[]=koreader-plugin'
