name: Lua CI

on:
  push:
  pull_request:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Syntax check
        run: |
          find . -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: CWSync unit tests
        working-directory: tests
        run: |
          lua5.1 shelf_order_test.lua
          lua5.1 opds_collection_snapshot_test.lua
          lua5.1 migration_test.lua
          lua5.1 sync_logic_test.lua
          lua5.1 delivery_test.lua
          lua5.1 device_capabilities_test.lua
          lua5.1 sync_client_outcome_test.lua
